services:
  postgres:
    image: postgres:16-alpine
    container_name: tracerlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracerlens
      POSTGRES_PASSWORD: tracerlens
      POSTGRES_DB: tracerlens
    ports:
      - "5432:5432"
    volumes:
      - tracerlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracerlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: run the dashboard in Docker too.
  #   docker compose --profile app up --build
  dashboard:
    build: .
    profiles: ["app"]
    container_name: tracerlens-dashboard
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://tracerlens:tracerlens@postgres:5432/tracerlens
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tracerlens_pgdata:
